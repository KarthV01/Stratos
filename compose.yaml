x-worker: &worker
  build: .
  command: ["python", "-m", "app.worker"]
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  environment: &worker-environment
    REDIS_URL: redis://redis:6379/0

services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - broker-data:/data

  controller:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

  nodeodm:
    image: opendronemap/nodeodm
    restart: unless-stopped
    command: ["--token", "stratos-development-token", "--max-concurrency", "1"]
    ports:
      - "3000:3000"
    volumes:
      - nodeodm-data:/var/www/data

  mapping:
    build: .
    command: ["python", "-m", "app.mapping.server"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      nodeodm:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0
      NODEODM_URL: http://nodeodm:3000
      NODEODM_TOKEN: stratos-development-token
      MAPPING_ARTIFACT_DIR: /data/mapping
    ports:
      - "8010:8010"
    volumes:
      - mapping-data:/data/mapping

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0
      GATEWAY_TCP_PORT: "7442"
      GATEWAY_GRPC_PORT: "7443"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_BRIDGE_ID: stratos-go-gateway-compose
    ports:
      - "7442:7442"
      - "7443:7443"

  worker-1:
    <<: *worker
    environment:
      <<: *worker-environment
      WORKER_ID: worker-1

  worker-2:
    <<: *worker
    environment:
      <<: *worker-environment
      WORKER_ID: worker-2

  worker-3:
    <<: *worker
    environment:
      <<: *worker-environment
      WORKER_ID: worker-3

volumes:
  broker-data:
  mqtt-data:
  nodeodm-data:
  mapping-data:
