apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: stratos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controller
        app.kubernetes.io/part-of: stratos
    spec:
      initContainers:
        - name: wait-for-redis
          image: redis:7.4-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis ping; do sleep 2; done
      containers:
        - name: controller
          image: stratos:dev
          imagePullPolicy: Never
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: stratos
spec:
  selector:
    app.kubernetes.io/name: controller
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: controller-agent
  namespace: stratos
  annotations:
    stratos.dev/security: "development-only-cleartext-listener"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: controller
  ports:
    - name: sap-http
      port: 8000
      targetPort: http
      nodePort: 30800
