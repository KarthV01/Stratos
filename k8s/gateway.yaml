apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: stratos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: stratos
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z redis 6379; do sleep 2; done
      containers:
        - name: gateway
          image: stratos:dev
          imagePullPolicy: Never
          command: ["python", "-m", "app.stratos_gateway.main"]
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: GATEWAY_TCP_PORT
              value: "7442"
            - name: GATEWAY_GRPC_PORT
              value: "7443"
          ports:
            - name: agent-tcp
              containerPort: 7442
            - name: agent-grpc
              containerPort: 7443
          readinessProbe:
            tcpSocket:
              port: agent-tcp
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: agent-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: stratos
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: agent-tcp
      port: 7442
      targetPort: agent-tcp
    - name: agent-grpc
      port: 7443
      targetPort: agent-grpc
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-agent
  namespace: stratos
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: agent-tcp
      port: 7442
      targetPort: agent-tcp
      nodePort: 31442
    - name: agent-grpc
      port: 7443
      targetPort: agent-grpc
      nodePort: 31443
