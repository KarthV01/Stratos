apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-config
  namespace: stratos
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    # Development listener for the local Minikube cluster only.
    listener 1883 0.0.0.0
    allow_anonymous true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mqtt
  namespace: stratos
spec:
  serviceName: mqtt
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt
        app.kubernetes.io/part-of: stratos
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mqtt-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt
  namespace: stratos
spec:
  selector:
    app.kubernetes.io/name: mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-device
  namespace: stratos
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      nodePort: 31883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-bridge
  namespace: stratos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt-bridge
        app.kubernetes.io/part-of: stratos
    spec:
      initContainers:
        - name: wait-for-services
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z redis 6379 && nc -z mqtt 1883; do sleep 2; done
      containers:
        - name: mqtt-bridge
          image: stratos:dev
          imagePullPolicy: Never
          command: ["python", "-m", "app.mqtt_bridge"]
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: MQTT_HOST
              value: mqtt
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_BRIDGE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
