apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: stratos
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: stratos
    spec:
      nodeSelector:
        stratos.dev/worker: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: worker
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      initContainers:
        - name: wait-for-redis
          image: redis:7.4-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis ping; do sleep 2; done
      containers:
        - name: worker
          image: stratos:dev
          imagePullPolicy: Never
          command: ["python", "-m", "app.worker"]
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
